; Dialogue Overhaul SF
;
; Changes here take effect the next time the game starts. 1 = on, 0 = off.

[General]
; Keep the normal first- or third-person camera when a conversation starts, instead of the
; dialogue close-up. (The game's own Settings > Dialogue Camera option turns the close-up off too.)
bDisableDialogueCamera = 1
; Walk, run, sprint, jump and crouch while talking. Walking too far away may end the conversation.
bAllowMovement = 1
; Turn the camera with the mouse while talking.
bAllowLooking = 1
; Extra details in Documents\My Games\Starfield\SFSE\Logs\DialogueOverhaulSF.log.
bDebugLog = 0
